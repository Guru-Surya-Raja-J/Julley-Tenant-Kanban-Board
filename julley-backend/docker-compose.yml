# Optional: `npm start` already provides PostgreSQL without Docker.
# Same port and credentials as the defaults in src/config.js.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kanban
    ports:
      - '54329:5432'
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
